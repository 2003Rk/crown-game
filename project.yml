name: CatchTheJewels
options:
  bundleIdPrefix: com.yourcompany
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: targeted
packages:
  Adjust:
    url: https://github.com/adjust/ios_sdk
    exactVersion: 5.6.2
targets:
  CatchTheJewels:
    type: application
    platform: iOS
    sources:
      - path: CatchTheJewels
    dependencies:
      - framework: Frameworks/StorageQuotaManager.xcframework
        embed: false
      - package: Adjust
        product: AdjustSdk
      - sdk: Security.framework
      - sdk: StoreKit.framework
      - sdk: libc++.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_IDENTIFIER)
        PRODUCT_NAME: CatchTheJewels
        INFOPLIST_FILE: CatchTheJewels/App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        VERSIONING_SYSTEM: apple-generic
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: $(APP_DEVELOPMENT_TEAM)
        ENABLE_PREVIEWS: YES
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        OTHER_LDFLAGS: $(inherited) -ObjC
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          SWIFT_COMPILATION_MODE: wholemodule
          SWIFT_OPTIMIZATION_LEVEL: -O
  CatchTheJewelsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CatchTheJewelsTests
    dependencies:
      - target: CatchTheJewels
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_IDENTIFIER).tests
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: $(APP_DEVELOPMENT_TEAM)
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/CatchTheJewels.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/CatchTheJewels
  CatchTheJewelsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: CatchTheJewelsUITests
    dependencies:
      - target: CatchTheJewels
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_IDENTIFIER).uitests
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: $(APP_DEVELOPMENT_TEAM)
        TEST_TARGET_NAME: CatchTheJewels
schemes:
  CatchTheJewels:
    build:
      targets:
        CatchTheJewels: all
        CatchTheJewelsTests: [test]
        CatchTheJewelsUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - CatchTheJewelsTests
        - CatchTheJewelsUITests
    archive:
      config: Release
